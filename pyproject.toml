[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligent-search-recommendation"
version = "0.1.0"
description = "FastAPI product search and recommendation engine with PostgreSQL full-text search, MiniLM/FAISS, hybrid fusion, optional RankNet, BPR-MF, hybrid recommendations, and bounded personalized search."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic-settings>=2.6,<3",
    "pandas>=2.2,<3",
    "pyarrow>=16,<23",
    "huggingface_hub>=0.25,<2",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "numpy>=1.26,<3",
    "sentence-transformers>=3.0,<6",
    "faiss-cpu>=1.8,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = [
    "recommendations/policies/*.json",
    "search/policies/*.json",
    "static/demo/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "postgres: tests that require a PostgreSQL test database",
]
