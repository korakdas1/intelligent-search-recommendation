[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
version_path_separator = os

# Overridden in alembic/env.py from application settings.
# Do not put real credentials here.
sqlalchemy.url = postgresql+psycopg://isre:change-me-locally@127.0.0.1:5432/intelligent_search_recommendation

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
